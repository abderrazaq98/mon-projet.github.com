<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — Sites d'intervention</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Login view -->
  <div id="loginView" class="login-box">
    <h2>Connexion admin</h2>
    <input type="password" id="passwordInput" placeholder="Mot de passe" />
    <button id="loginBtn">Se connecter</button>
    <div id="loginError" class="error-msg"></div>
  </div>

  <!-- Admin view -->
  <div id="adminView" class="hidden">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-left">
        <h1>SIGRYS</h1>
        <div class="topbar-badges">
          <span class="badge" id="badgePoints">Points <strong>0</strong></span>
          <span class="badge" id="badgeSectors">Secteurs <strong>0</strong></span>
        </div>
      </div>
      <div class="topbar-actions">
        <a href="index.html" class="topbar-icon-btn" title="Voir la carte">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10A15.3 15.3 0 0 1 12 2z"/></svg>
        </a>
        <button id="logoutBtn" class="topbar-logout">Déconnexion</button>
      </div>
    </header>

    <!-- Tabs -->
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="interventions">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>Interventions</span>
      </button>
      <button class="admin-tab" data-tab="map">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
        <span>Carte</span>
      </button>
      <button class="admin-tab" data-tab="sectors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Administration</span>
      </button>
    </div>

    <!-- ========== TAB INTERVENTIONS (Points) ========== -->
    <div id="tabPoints" class="admin-container">

      <!-- Row 1: Filter + Add -->
      <div class="admin-toolbar">
        <select id="filterType">
          <option value="all">Tous les champs</option>
          <option value="ig">IG</option>
          <option value="adresse">Adresse</option>
          <option value="batiment">N° Bât.</option>
          <option value="secteur">Secteur</option>
        </select>
        <input type="text" id="filterInput" placeholder="Filtrer..." />
        <button class="btn btn-primary" id="addBtn">+ Ajouter</button>
      </div>

      <!-- Row 2: Exports -->
      <div class="admin-toolbar">
        <select id="lambertZone" title="Zone Lambert">
          <option value="LAMBERT_NORD">Lambert Nord</option>
          <option value="LAMBERT_CENTRE">Lambert Centre</option>
          <option value="LAMBERT_SUD">Lambert Sud</option>
          <option value="LAMBERT_SAHARA">Lambert Sahara</option>
        </select>
        <button class="btn btn-outline" id="exportBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Excel
        </button>
        <select id="autoExport" class="btn btn-outline" style="padding-right:24px;">
          <option value="">Auto</option>
          <option value="all">Tous les points</option>
          <option value="selected">Sélection seulement</option>
        </select>
        <label class="btn btn-outline" style="margin:0; cursor:pointer;">
          SHP
          <input type="file" id="importShpFile" accept=".zip" style="display:none;" />
        </label>
        <label class="btn btn-outline" style="margin:0; cursor:pointer;">
          KML
          <input type="file" id="importKmlFile" accept=".kml" style="display:none;" />
        </label>
      </div>

      <!-- Row 3: Bulk actions -->
      <div class="admin-toolbar bulk-toolbar">
        <label class="bulk-check"><input type="checkbox" id="selectAllBtn" /> Tout sélectionner</label>
        <label class="bulk-check"><input type="checkbox" id="deselectAllBtn" /> Tout désélectionner</label>
        <button class="btn btn-danger" id="deleteSelectedBtn">Supprimer (<span id="deleteCount">0</span>)</button>
        <button class="btn btn-outline" id="zoomSelectedBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Zoomer sélection
        </button>
        <button class="btn btn-outline" id="exportSelectedBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Exporter Excel
        </button>
        <label class="btn btn-warning" style="margin:0; cursor:pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Mise à jour
          <input type="file" id="importUpdateFile" accept=".xlsx,.xls" style="display:none;" />
        </label>
        <span class="bulk-count" id="selectionInfo">0 point(s)</span>
      </div>

      <div id="importStatus" class="import-status"></div>

      <div id="gmapsLinkBar" class="gmaps-link-bar hidden">
        <span>Lien Google Maps :</span>
        <input type="text" id="gmapsLinkInput" readonly />
        <button class="btn btn-outline" id="gmapsCopyBtn" style="padding:4px 10px;font-size:0.8rem;">Copier</button>
      </div>

      <div id="adminMap" style="height:280px; border-radius:6px; margin-bottom:14px; display:none;"></div>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="headerCheckbox" /></th>
              <th>ID</th><th>IG</th><th>Adresse</th><th>N° Bât.</th><th>Secteur</th><th>X</th><th>Y</th><th>Lat</th><th>Lng</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="pointsTableBody">
            <tr class="empty-row">
              <td colspan="11" class="empty-state">Aucun point trouvé</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <span id="pageInfo" class="pagination-info"></span>
        <div class="pagination-btns">
          <button id="firstPage" disabled>Début</button>
          <button id="prevPage" disabled>Préc.</button>
          <span id="pageNum">1 / 1</span>
          <button id="nextPage" disabled>Suiv.</button>
          <button id="lastPage" disabled>Fin</button>
        </div>
      </div>
    </div>

    <!-- ========== TAB CARTE ========== -->
    <div id="tabMap" class="admin-container hidden">
      <div id="adminFullMap" style="height:calc(100vh - 200px); border-radius:8px;"></div>
    </div>

    <!-- ========== TAB SECTORS (Administration) ========== -->
    <div id="tabSectors" class="admin-container hidden">
      <div class="admin-toolbar">
        <input type="text" id="sectorFilterInput" placeholder="Filtrer..." />
        <button class="btn btn-primary" id="addSectorBtn">+ Ajouter</button>
        <label class="btn btn-outline" style="margin:0; cursor:pointer;">
          Importer (Excel)
          <input type="file" id="importSectorFile" accept=".xlsx,.xls" style="display:none;" />
        </label>
        <label class="btn btn-outline" style="margin:0; cursor:pointer;">
          Importer (Excel)
          <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none;" />
        </label>
        <button class="btn btn-danger" id="deleteSelectedSectorsBtn">Supprimer (<span id="sectorDeleteCount">0</span>)</button>
      </div>

      <div class="table-wrapper">
        <table class="admin-table">
          <thead>
            <tr>
              <th><input type="checkbox" id="sectorHeaderCheckbox" /></th>
              <th>ID</th><th>Numéro</th><th>Nom</th><th>Agence</th><th>Couleur</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="sectorsTableBody">
            <tr class="empty-row">
              <td colspan="7" class="empty-state">Aucun secteur trouvé</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination">
        <span id="sectorPageInfo" class="pagination-info"></span>
        <div class="pagination-btns">
          <button id="sectorPrevPage" disabled>Préc.</button>
          <span id="sectorPageNum">1 / 1</span>
          <button id="sectorNextPage" disabled>Suiv.</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal point ajout/édition -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="modalTitle">Ajouter un point</h3>
      <input type="hidden" id="editId" />
      <label>Numéro IG</label>
      <input type="text" id="fIg" />
      <label>Adresse</label>
      <input type="text" id="fAdresse" />
      <label>Numéro de bâtiment</label>
      <input type="text" id="fNumBatiment" />
      <label>Secteur (numéro)</label>
      <input type="text" id="fSecteurNumero" />
      <label>Emplacement (cliquez sur la carte pour placer le point)</label>
      <div id="pickerMap" style="height:220px; border-radius:6px; margin-bottom:6px;"></div>
      <div style="display:flex; gap:10px; font-size:0.82rem; color:#555; margin-bottom:4px;">
        <span>X: <span id="fXDisplay">—</span></span>
        <span>Y: <span id="fYDisplay">—</span></span>
      </div>
      <input type="hidden" id="fX" />
      <input type="hidden" id="fY" />
      <input type="hidden" id="fLat" />
      <input type="hidden" id="fLng" />
      <input type="hidden" id="fSecteurNom" />
      <label>Commentaire</label>
      <textarea id="fCommentaire" rows="2"></textarea>
      <div id="modalError" class="error-msg"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="modalCancel">Annuler</button>
        <button class="btn btn-primary" id="modalSave">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Modal secteur ajout/édition -->
  <div id="sectorModalOverlay" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 id="sectorModalTitle">Ajouter un secteur</h3>
      <input type="hidden" id="editSectorId" />
      <label>Numéro de secteur</label>
      <input type="text" id="fSectorNumero" />
      <label>Nom du secteur</label>
      <input type="text" id="fSectorNom" />
      <label>Agence</label>
      <input type="text" id="fSectorAgence" />
      <label>Couleur</label>
      <input type="color" id="fSectorColor" value="#1e5f8a" style="width:100%;height:40px;" />
      <label>Géométrie (GeoJSON, optionnel)</label>
      <textarea id="fSectorGeometry" rows="4" placeholder='{"type":"Polygon","coordinates":[[...]]}'></textarea>
      <div id="sectorModalError" class="error-msg"></div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="sectorModalCancel">Annuler</button>
        <button class="btn btn-primary" id="sectorModalSave">Enregistrer</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">Créé par Amar Abderrazaq</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>

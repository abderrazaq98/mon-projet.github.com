<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sites d'intervention — Carte</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Login view -->
  <div id="loginView" class="login-box">
    <h2>Carte des interventions</h2>
    <p class="login-subtitle">Entrez le mot de passe pour accéder à la carte</p>
    <input type="password" id="passwordInput" placeholder="Mot de passe" />
    <button id="loginBtn">Accéder à la carte</button>
    <div id="loginError" class="error-msg"></div>
  </div>

  <!-- Map view -->
  <div id="mapView" class="hidden">
    <header class="topbar">
      <h1>Carte des sites d'intervention</h1>
      <div class="topbar-actions">
        <a href="admin.html" class="admin-link">Espace admin</a>
      </div>
    </header>

    <div class="search-bar">
      <select id="searchType">
        <option value="">Recherche libre</option>
        <option value="ig">Identifiant géographique (IG)</option>
        <option value="adresse">Adresse</option>
        <option value="batiment">Numéro de bâtiment</option>
        <option value="secteur_numero">Secteur (numéro)</option>
        <option value="secteur_nom">Secteur (nom)</option>
        <option value="coord">Coordonnées (lat, lng)</option>
      </select>
      <input type="text" id="searchInput" placeholder="Rechercher..." />
      <button id="searchBtn">Rechercher</button>
      <button id="clearSearchBtn" class="btn-secondary" style="display:none;">✕</button>
      <span id="searchStatus"></span>
    </div>

    <div id="map"></div>

    <!-- Satellite toggle -->
    <button id="satelliteBtn" class="satellite-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span>Satellite</span>
    </button>

    <!-- Logout button -->
    <button id="logoutBtn" class="logout-btn" title="Se déconnecter">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="btn-text">Déconnexion</span>
    </button>

    <!-- Results panel -->
    <div id="resultsPanel" class="results-panel hidden">
      <div class="results-header">
        <span id="resultsCount"></span>
        <button id="closeResults">✕</button>
      </div>
      <div id="resultsList"></div>
    </div>

    <!-- Detail panel (point or sector) -->
    <div id="detailPanel" class="detail-panel hidden">
      <div class="detail-header">
        <span id="detailTitle"></span>
        <button id="closeDetail">✕</button>
      </div>
      <div id="detailContent"></div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <span>Chargement des points...</span>
    </div>
  </div>

  <footer class="site-footer">Créé par Amar Abderrazaq</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
